<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#151515" />
  <title>Hearth Chat</title>
  <style>
    :root{--bg:#151515;--panel:#1e1e1e;--panel2:#272727;--text:#f4f4f4;--muted:#9c9c9c;--border:#383838;--accent:#d9773d;--ai:#7c5ce6;--danger:#e45b5b}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{touch-action:manipulation}#app{min-height:100vh}
    .login{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(390px,100%);background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:0 20px 60px #0003;animation:pop .3s ease}.card h1{margin:0 0 8px}.card p{color:var(--muted);margin:0 0 18px}.login input,.modal input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);outline:none;margin-bottom:12px}.primary{width:100%;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.theme-float{float:right}
    .hc{min-height:100vh;display:flex;overflow:hidden;background:var(--bg);color:var(--text);transition:.25s ease}.side{width:245px;background:var(--panel);border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:14px}.brand{font-weight:800;font-size:20px}.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 8px 2px}.channels{display:flex;flex-direction:column;gap:6px}.channel{border:0;background:transparent;color:var(--muted);text-align:left;padding:10px;border-radius:10px;cursor:pointer;font-size:14px}.channel.active,.channel:hover{background:var(--panel2);color:var(--text)}.channel-row{display:flex;align-items:center;gap:4px}.channel-row .channel{flex:1}.more-btn{display:none}.channel-row:hover .more-btn{display:block}.grow{flex:1}.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.small-btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 7px;font-size:12px;cursor:pointer}.small-btn:hover{transform:translateY(-1px)}
    .main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:62px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--border);font-weight:700}.top-sub{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}.icon{border:0;background:transparent;color:var(--text);font-size:20px;padding:8px;cursor:pointer;border-radius:10px}.icon:hover{background:var(--panel2)}.hamb{display:none}
    .messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}.empty{margin:auto;text-align:center;color:var(--muted);max-width:420px}.empty h2{color:var(--text)}.empty code{background:var(--panel2);padding:4px 7px;border-radius:7px}.msg{display:flex;gap:10px;animation:pop .22s ease}.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:white;display:grid;place-items:center;font-weight:700;flex:0 0 auto}.bubble{min-width:0}.meta{font-size:13px;font-weight:700}.time{font-weight:400;color:var(--muted);font-size:11px;margin-left:8px}.text{margin-top:4px;line-height:1.45;word-break:break-word}.preview{max-width:240px;max-height:180px;border-radius:12px;margin-top:8px;display:block;border:1px solid var(--border)}a{color:#8bb8ff}
    .composer{padding:12px 18px 18px;border-top:1px solid var(--border)}.error{color:var(--danger);font-size:12px;margin-bottom:7px}.attach{font-size:12px;color:var(--muted);margin-bottom:7px}.attach button{border:0;background:transparent;color:var(--text);cursor:pointer}.row{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:7px}.input{flex:1;border:0;outline:0;background:transparent;color:var(--text);padding:9px;font-size:14px;min-width:0}.send{border:0;background:var(--accent);color:white;border-radius:10px;padding:9px 12px;cursor:pointer}.ai{background:var(--ai)}button:disabled{opacity:.45;cursor:not-allowed}
    .modal-backdrop{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:20;animation:fade .18s ease}.modal{width:min(430px,100%);background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 25px 80px #0008;animation:pop .2s ease}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.modal h2{font-size:20px;margin:0}.modal p{color:var(--muted);font-size:14px;line-height:1.45;margin:6px 0 16px}.modal label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}.secondary{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer}.modal .primary{width:auto;padding:10px 16px}.hint{font-size:12px;color:var(--muted);margin-top:-4px;margin-bottom:12px}.invite-box{background:var(--panel2);border:1px dashed var(--border);padding:11px;border-radius:10px;font-size:13px;word-break:break-all}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:999px;font-size:13px;z-index:30;box-shadow:0 10px 30px #0005;animation:pop .2s ease}
    @keyframes pop{from{opacity:0;transform:translateY(7px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes fade{from{opacity:0}to{opacity:1}}
    @media(max-width:700px){.side{position:fixed;z-index:10;top:0;bottom:0;left:0;transform:translateX(-105%);transition:.25s;width:min(270px,84vw);box-shadow:20px 0 50px #0008}.side.open{transform:translateX(0)}.hamb{display:block}.messages{padding:14px}.composer{padding:10px 12px 14px}.top{padding:0 10px}.hc{min-height:100vh}.side-actions{gap:6px}.modal{padding:18px}.send{padding:9px 10px}}
  </style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const SUPABASE_URL = 'https://qjnnvgfgnshgglkmdiuq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_wLUIcNyakMF5RolNBTcMxA_sosSfpQg';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let session = null, profileName = '', dark = true, channelId = null;
  let groups = [], channels = [], messages = [], draft = '', attachment = null;
  let menuOpen = false, listening = false, recognition = null, error = '', modal = null, toast = '';
  let realtimeChannel = null, pollTimer = null;
  const app = document.getElementById('app');

  const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const slug = s => String(s).trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,28);
  const invite = () => 'HEARTH-' + Math.random().toString(36).slice(2,8).toUpperCase() + '-' + Math.random().toString(36).slice(2,7).toUpperCase();
  const time = d => new Date(d || Date.now()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  const currentChannel = () => channels.find(c => c.id === channelId) || channels[0] || null;
  const currentGroup = () => { const c=currentChannel(); return c ? groups.find(g=>g.id===c.group_id) : null; };

  function applyTheme() {
    const r = document.documentElement.style;
    if (dark) {
      r.setProperty('--bg','#151515'); r.setProperty('--panel','#1e1e1e'); r.setProperty('--panel2','#272727');
      r.setProperty('--text','#f4f4f4'); r.setProperty('--muted','#9c9c9c'); r.setProperty('--border','#383838');
    } else {
      r.setProperty('--bg','#f5f5f5'); r.setProperty('--panel','#ffffff'); r.setProperty('--panel2','#eeeeee');
      r.setProperty('--text','#202020'); r.setProperty('--muted','#666'); r.setProperty('--border','#d7d7d7');
    }
    document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#151515' : '#f5f5f5');
  }
  function toggleTheme(){ dark=!dark; localStorage.setItem('hearth-theme', dark?'dark':'light'); applyTheme(); render(); }
  function showToast(t){ toast=t; render(); setTimeout(()=>{ if(toast===t){toast=''; render()} },1800); }

  async function loadData() {
    if (!session) return;
    const [gr, ch] = await Promise.all([
      sb.from('channel_groups').select('*').order('created_at'),
      sb.from('channels').select('*').order('created_at')
    ]);
    if (gr.error) { error = gr.error.message; }
    if (ch.error) { error = ch.error.message; }
    groups = gr.data || [];
    channels = ch.data || [];
    if (!channelId || !channels.some(c=>c.id===channelId)) channelId = channels[0]?.id || null;
    await loadMessages();
  }

  async function loadMessages() {
    if (!channelId) { messages=[]; return; }
    const {data, error:err} = await sb.from('messages').select('*').eq('channel_id', channelId).order('created_at');
    if (err) error = err.message;
    messages = data || [];
  }

  function stopRealtime() {
    if (realtimeChannel) sb.removeChannel(realtimeChannel);
    realtimeChannel = null;
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = null;
  }
  function startRealtime() {
    stopRealtime();
    if (!channelId || !session) return;
    realtimeChannel = sb.channel('hearth-msg-' + channelId)
      .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages', filter:'channel_id=eq.'+channelId}, payload => {
        if (!messages.some(m=>m.id===payload.new.id)) { messages.push(payload.new); render(); }
      }).subscribe();
    pollTimer = setInterval(async ()=> {
      const old = messages.length;
      await loadMessages();
      if (messages.length !== old) render();
    }, 5000);
  }

  async function setChannel(id) {
    channelId=id; draft=''; attachment=null; error='';
    await loadMessages(); startRealtime(); render();
  }

  function attachmentHTML(m) {
    if (!m.file_url) return '';
    const name = m.file_url.split('/').pop().split('?')[0] || 'Attachment';
    if (/\.(png|jpe?g|gif|webp)$/i.test(name)) return `<a href="${esc(m.file_url)}" target="_blank" rel="noopener"><img class="preview" src="${esc(m.file_url)}" alt="attachment"></a>`;
    return `<a href="${esc(m.file_url)}" target="_blank" rel="noopener">📎 ${esc(decodeURIComponent(name))}</a>`;
  }

  function groupedChannelsHTML() {
    if (!groups.length) return `<div class="empty"><h2>No groups yet</h2><p>Create a group or join one with an invite code.</p></div>`;
    return groups.map(g => {
      const list = channels.filter(c=>c.group_id===g.id);
      return `<div class="section-title">${esc(g.name)}</div><div class="channels">${
        list.length ? list.map(c=>`<div class="channel-row"><button class="channel ${channelId===c.id?'active':''}" data-channel="${c.id}"># ${esc(c.name)}</button><button class="icon more-btn" data-info="${c.id}" title="Channel info">ⓘ</button></div>`).join('')
        : `<div class="hint" style="padding:0 8px 10px">No channels yet.</div>`
      }</div>`;
    }).join('');
  }

  function loginHTML() {
    app.innerHTML = `<div class="login"><form class="card" id="loginForm">
      <button type="button" class="icon theme-float" id="themeBtn">${dark?'☀️':'🌙'}</button>
      <h1>Welcome to Hearth</h1><p>Sign in to chat with real people across devices.</p>
      <input id="email" type="email" autocomplete="email" placeholder="Email address" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password (min 6 characters)" required>
      <input id="displayName" maxlength="24" placeholder="Display name (needed for new accounts)">
      <button class="primary" id="loginBtn">Login</button>
      <button type="button" class="secondary" id="signupBtn" style="width:100%;margin-top:8px">Create account</button>
      ${error?`<div class="error" style="margin-top:10px">${esc(error)}</div>`:''}
      <div class="hint" style="margin-top:12px">If email confirmation is enabled, check your inbox after signing up.</div>
    </form></div>`;
    document.getElementById('themeBtn').onclick=toggleTheme;
    document.getElementById('loginForm').onsubmit=async e=>{
      e.preventDefault(); error='';
      const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
      const {error:err}=await sb.auth.signInWithPassword({email,password});
      if(err){error=err.message;render();}
    };
    document.getElementById('signupBtn').onclick=async ()=>{
      error='';
      const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value, name=document.getElementById('displayName').value.trim();
      if(!name){error='Please enter a display name for your account.';render();return;}
      if(password.length<6){error='Password must be at least 6 characters.';render();return;}
      const {data,error:err}=await sb.auth.signUp({email,password,options:{data:{display_name:name}}});
      if(err){error=err.message;render();return;}
      profileName=name;
      if(data.session) showToast('Account created. You are signed in.');
      else { error='Account created. Check your email to confirm it, then log in.'; render(); }
    };
  }

  function modalHTML() {
    if (!modal) return '';
    if (modal==='create-group') return `<div class="modal-backdrop" data-close-modal><form class="modal" id="createGroupForm">
      <div class="modal-head"><h2>Create channel group</h2><button type="button" class="icon" data-close-modal>×</button></div>
      <p>Create a group, then share its invite code with other users.</p>
      <label>Group name</label><input id="newGroupName" maxlength="32" placeholder="e.g. Friends" required>
      <label>First channel</label><input id="firstChannelName" maxlength="28" placeholder="e.g. general" value="general" required>
      <div class="modal-actions"><button type="button" class="secondary" data-close-modal>Cancel</button><button class="primary">Create</button></div>
    </form></div>`;
    if (modal==='create-channel') {
      if (!groups.length) return '';
      return `<div class="modal-backdrop" data-close-modal><form class="modal" id="createChannelForm">
        <div class="modal-head"><h2>Create channel</h2><button type="button" class="icon" data-close-modal>×</button></div>
        <p>Create a new channel inside one of your groups. You must be the group owner.</p>
        <label>Group</label><select id="channelGroup">${groups.map(g=>`<option value="${g.id}" ${g.id===currentGroup()?.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select>
        <label>Channel name</label><input id="newChannelName" maxlength="28" placeholder="e.g. gaming" required>
        <div class="modal-actions"><button type="button" class="secondary" data-close-modal>Cancel</button><button class="primary">Create</button></div>
      </form></div>`;
    }
    if (modal==='join') return `<div class="modal-backdrop" data-close-modal><form class="modal" id="joinForm">
      <div class="modal-head"><h2>Join a channel group</h2><button type="button" class="icon" data-close-modal>×</button></div>
      <p>Enter the invite code shared by the group owner.</p>
      <label>Invite code</label><input id="inviteCode" maxlength="80" placeholder="HEARTH-XXXXXX-XXXXX" required>
      <div class="modal-actions"><button type="button" class="secondary" data-close-modal>Cancel</button><button class="primary">Join</button></div>
    </form></div>`;
    if (modal && modal.type==='info') {
      const c=channels.find(x=>x.id===modal.id), g=c&&groups.find(x=>x.id===c.group_id);
      if(!c||!g)return '';
      return `<div class="modal-backdrop" data-close-modal><div class="modal">
        <div class="modal-head"><h2># ${esc(c.name)}</h2><button type="button" class="icon" data-close-modal>×</button></div>
        <p><strong>${esc(g.name)}</strong>${g.owner_id===session.user.id?' · You own this group':''}</p>
        <label>Group invite code</label><div class="invite-box">${esc(g.invite_code)}</div>
        <div class="hint" style="margin-top:8px">Share this code so others can join the whole group.</div>
        <div class="modal-actions"><button class="secondary" id="copyCode">Copy code</button><button class="primary" data-close-modal>Close</button></div>
      </div></div>`;
    }
    return '';
  }

  function render() {
    applyTheme();
    if (!session) { loginHTML(); return; }
    const c=currentChannel(), g=currentGroup();
    const list = !c ? `<div class="empty"><h2>Welcome to Hearth</h2><p>Create a group or join one to start chatting.</p></div>` :
      (messages.length ? messages.map(m=>`<div class="msg"><div class="avatar">${esc((m.user_name||'?').slice(0,1).toUpperCase())}</div><div class="bubble"><div class="meta">${esc(m.user_name||'User')}<span class="time">${time(m.created_at)}</span></div>${m.content?`<div class="text">${esc(m.content)}</div>`:''}${attachmentHTML(m)}</div></div>`).join('') :
      `<div class="empty"><h2>Welcome to #${esc(c.name)}</h2><p>Start a conversation in <strong>${esc(g?.name||'this group')}</strong>.</p></div>`);

    app.innerHTML = `<div class="hc"><aside class="side ${menuOpen?'open':''}" id="side">
      <div class="side-head"><div class="brand">🔥 Hearth Chat</div><button class="icon" id="closeSide">×</button></div>
      <div class="side-actions"><button class="small-btn" id="createGroup">＋ Group</button><button class="small-btn" id="createChannel"># Channel</button><button class="small-btn" id="joinChannel">↪ Join</button></div>
      ${groupedChannelsHTML()}<div class="grow"></div><button class="channel" id="logout">↪ Logout</button>
    </aside><main class="main"><header class="top"><button class="icon hamb" id="menu">☰</button><span>${c?'# '+esc(c.name):'Hearth Chat'}</span><span class="top-sub">${esc(g?.name||'')}</span><span class="grow"></span><button class="icon" id="channelInfo" ${c?'':'disabled'} title="Group invite">ⓘ</button><button class="icon" id="theme">${dark?'☀️':'🌙'}</button></header>
      <section class="messages" id="messages">${list}</section>
      <form class="composer" id="composer">${error?`<div class="error">${esc(error)}</div>`:''}${attachment?`<div class="attach">📎 ${esc(attachment.name)} <button type="button" id="removeAttachment">×</button></div>`:''}
        <div class="row"><input id="file" type="file" hidden accept="image/*,.txt,.pdf,.doc,.docx"><button type="button" class="icon" id="fileBtn" ${c?'':'disabled'}>📎</button>
        <input class="input" id="draft" ${c?'':'disabled'} placeholder="${c?'Message #'+esc(c.name):'Select or create a channel'}" value="${esc(draft)}">
        <button type="button" class="icon" id="voice" ${c?'':'disabled'}>${listening?'🔴':'🎤'}</button>
        <button class="send" id="send" ${(!c || (!draft.trim()&&!attachment))?'disabled':''}>➤</button></div>
      </form></main></div>${modalHTML()}${toast?`<div class="toast">${esc(toast)}</div>`:''}`;

    document.querySelectorAll('[data-channel]').forEach(b=>b.onclick=()=>{menuOpen=false;setChannel(b.dataset.channel)});
    document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>{modal={type:'info',id:b.dataset.info};render()});
    document.getElementById('logout').onclick=()=>sb.auth.signOut();
    document.getElementById('theme').onclick=toggleTheme;
    document.getElementById('menu').onclick=()=>{menuOpen=!menuOpen;render()};
    document.getElementById('closeSide').onclick=()=>{menuOpen=false;render()};
    document.getElementById('createGroup').onclick=()=>{menuOpen=false;modal='create-group';render()};
    document.getElementById('createChannel').onclick=()=>{menuOpen=false;modal='create-channel';render()};
    document.getElementById('joinChannel').onclick=()=>{menuOpen=false;modal='join';render()};
    document.getElementById('channelInfo').onclick=()=>{modal={type:'info',id:channelId};render()};

    const draftEl=document.getElementById('draft');
    if(draftEl) draftEl.oninput=()=>{draft=draftEl.value;document.getElementById('send').disabled=!(currentChannel()&&(draft.trim()||attachment))};
    document.getElementById('fileBtn').onclick=()=>document.getElementById('file').click();
    document.getElementById('file').onchange=chooseFile;
    document.getElementById('voice').onclick=voice;
    document.getElementById('composer').onsubmit=e=>{e.preventDefault();send()};
    if(attachment) document.getElementById('removeAttachment').onclick=()=>{attachment=null;render()};

    document.querySelectorAll('[data-close-modal]').forEach(x=>x.onclick=e=>{if(e.target===x||x.tagName==='BUTTON'){modal=null;render()}});
    bindModalForms();
    const copy=document.getElementById('copyCode');
    if(copy) copy.onclick=async()=>{const g=currentGroup(); try{await navigator.clipboard.writeText(g?.invite_code||'');showToast('Invite code copied')}catch{showToast(g?.invite_code||'')}};
    requestAnimationFrame(()=>{const box=document.getElementById('messages'); if(box) box.scrollTop=box.scrollHeight});
  }

  function bindModalForms() {
    const gf=document.getElementById('createGroupForm');
    if(gf) gf.onsubmit=async e=>{
      e.preventDefault(); error='';
      const name=document.getElementById('newGroupName').value.trim(), channelName=slug(document.getElementById('firstChannelName').value);
      if(!name||!channelName)return;
      let groupData=null, err=null;
      for(let i=0;i<4;i++){
        const res=await sb.from('channel_groups').insert({name,invite_code:invite(),owner_id:session.user.id}).select().single();
        groupData=res.data; err=res.error; if(!err)break;
      }
      if(err){error=err.message;render();return;}
      const mem=await sb.from('group_members').insert({group_id:groupData.id,user_id:session.user.id});
      if(mem.error){error=mem.error.message;render();return;}
      const ch=await sb.from('channels').insert({group_id:groupData.id,name:channelName,created_by:session.user.id}).select().single();
      if(ch.error){error=ch.error.message;render();return;}
      groups.push(groupData); channels.push(ch.data); channelId=ch.data.id; modal={type:'info',id:ch.data.id}; await loadMessages(); startRealtime(); render();
    };
    const cf=document.getElementById('createChannelForm');
    if(cf) cf.onsubmit=async e=>{
      e.preventDefault(); error='';
      const group_id=document.getElementById('channelGroup').value, name=slug(document.getElementById('newChannelName').value);
      const group=groups.find(g=>g.id===group_id);
      if(!name||!group)return;
      if(group.owner_id!==session.user.id){error='Only the group owner can create new channels.';render();return;}
      const {data, error:err}=await sb.from('channels').insert({group_id,name,created_by:session.user.id}).select().single();
      if(err){error=err.message;render();return;}
      channels.push(data); modal=null; await setChannel(data.id);
    };
    const jf=document.getElementById('joinForm');
    if(jf) jf.onsubmit=async e=>{
      e.preventDefault(); error='';
      const code=document.getElementById('inviteCode').value.trim().toUpperCase();
      const {data,error:err}=await sb.rpc('join_group_by_invite',{code});
      if(err){error=err.message;render();return;}
      await loadData(); const first=channels.find(c=>c.group_id===data); modal=null; if(first) await setChannel(first.id); else render(); showToast('Joined the group');
    };
  }

  async function chooseFile(e) {
    const file=e.target.files&&e.target.files[0]; e.target.value='';
    if(!file)return;
    if(file.size>5*1024*1024){error='Please choose a file under 5 MB.';render();return;}
    attachment=file; error=''; render();
  }

  async function uploadAttachment(file) {
    const ext=(file.name.split('.').pop()||'file').replace(/[^a-z0-9]/gi,'');
    const path=`${session.user.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
    const {error:upErr}=await sb.storage.from('hearth-files').upload(path,file,{upsert:false});
    if(upErr) throw new Error('File upload needs the Supabase Storage bucket "hearth-files". ' + upErr.message);
    const {data}=sb.storage.from('hearth-files').getPublicUrl(path);
    return data.publicUrl;
  }

  async function send() {
    const c=currentChannel(); if(!c || (!draft.trim()&&!attachment))return;
    error='';
    const text=draft.trim(), file=attachment; draft=''; attachment=null; render();
    try {
      let file_url=null;
      if(file) file_url=await uploadAttachment(file);
      const {error:err}=await sb.from('messages').insert({
        channel_id:c.id,user_id:session.user.id,user_name:profileName||session.user.user_metadata?.display_name||session.user.email?.split('@')[0]||'User',
        content:text||null,file_url
      });
      if(err) throw err;
      await loadMessages(); render();
    } catch(err) { error=err.message||'Could not send message.'; draft=text; attachment=file; render(); }
  }

  function voice() {
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){error='Voice input is not supported by this browser.';render();return;}
    if(listening&&recognition){recognition.stop();return;}
    recognition=new SR(); recognition.lang='en-US'; recognition.interimResults=false;
    recognition.onstart=()=>{listening=true;render()};
    recognition.onend=()=>{listening=false;render()};
    recognition.onerror=()=>{listening=false;error='Microphone access failed or was blocked.';render()};
    recognition.onresult=e=>{draft=`${draft}${draft?' ':''}${e.results[0][0].transcript}`;render()};
    recognition.start();
  }

  async function boot() {
    dark=localStorage.getItem('hearth-theme')!=='light';
    const {data:{session:s}}=await sb.auth.getSession(); session=s;
    if(session){profileName=session.user.user_metadata?.display_name||session.user.email?.split('@')[0]||'User'; await loadData(); startRealtime();}
    render();
  }

  sb.auth.onAuthStateChange(async (_event, s)=>{
    session=s;
    if(!session){profileName='';groups=[];channels=[];messages=[];channelId=null;stopRealtime();error='';render();return;}
    profileName=session.user.user_metadata?.display_name||session.user.email?.split('@')[0]||'User';
    await loadData(); startRealtime(); render();
  });

  boot();
})();
</script>
</body>
</html>
